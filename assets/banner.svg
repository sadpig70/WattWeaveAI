<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="WattWeaveAI — AI-native compute-energy orchestration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1020"/>
      <stop offset="55%"  stop-color="#0f2740"/>
      <stop offset="100%" stop-color="#0a3b3a"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7df9ff"/>
      <stop offset="40%"  stop-color="#34e0a1"/>
      <stop offset="80%"  stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#34e0a1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#34e0a1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34e0a1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34e0a1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34e0a1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1b3550" stroke-width="0.7"/>
    </pattern>

    <symbol id="zone" viewBox="-30 -30 60 60">
      <polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5"
               fill="#0f2740" stroke="url(#brand)" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#34e0a1"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- Decorative right-side glow -->
  <circle cx="1010" cy="160" r="220" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="80" y="148" font-size="86" fill="url(#brand)" letter-spacing="-2">WattWeaveAI</text>
  </g>

  <!-- Tagline -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="82" y="196" font-size="24" font-weight="500" fill="#cfeefb" letter-spacing="0.5">
      AI-native compute–energy orchestration control plane
    </text>
    <text x="82" y="232" font-size="16" font-weight="400" fill="#7fa8c0" letter-spacing="1.2">
      cost · carbon · latency · sovereignty · chip availability — woven into one decision
    </text>
  </g>

  <!-- Status pills -->
  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(82,260)">
      <rect width="120" height="30" rx="15" fill="#0f2740" stroke="#34e0a1" stroke-width="1.2"/>
      <text x="60" y="20" fill="#34e0a1" text-anchor="middle">31 / 31 tests</text>
    </g>
    <g transform="translate(212,260)">
      <rect width="118" height="30" rx="15" fill="#0f2740" stroke="#7df9ff" stroke-width="1.2"/>
      <text x="59" y="20" fill="#7df9ff" text-anchor="middle">PG / PGF v2.5</text>
    </g>
    <g transform="translate(340,260)">
      <rect width="100" height="30" rx="15" fill="#0f2740" stroke="#ffd166" stroke-width="1.2"/>
      <text x="50" y="20" fill="#ffd166" text-anchor="middle">MVP v0.1</text>
    </g>
    <g transform="translate(450,260)">
      <rect width="118" height="30" rx="15" fill="#0f2740" stroke="#ff8c42" stroke-width="1.2"/>
      <text x="59" y="20" fill="#ff8c42" text-anchor="middle">carbon-aware</text>
    </g>
  </g>

  <!-- Fabric: 6 zones connected -->
  <g transform="translate(900,160)">
    <!-- Connecting lines -->
    <g stroke="url(#line)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -150,-90  L  0,0"/>
      <path d="M  150,-90  L  0,0"/>
      <path d="M -180,  0  L  0,0"/>
      <path d="M  180,  0  L  0,0"/>
      <path d="M -150, 90  L  0,0"/>
      <path d="M  150, 90  L  0,0"/>
    </g>

    <!-- Pulses along the lines -->
    <g fill="#7df9ff">
      <circle r="3">
        <animateMotion dur="3.2s" repeatCount="indefinite"
          path="M -150,-90 L 0,0"/>
      </circle>
      <circle r="3">
        <animateMotion dur="2.6s" repeatCount="indefinite"
          path="M 150,-90 L 0,0"/>
      </circle>
      <circle r="3">
        <animateMotion dur="3.5s" repeatCount="indefinite"
          path="M -180,0 L 0,0"/>
      </circle>
      <circle r="3">
        <animateMotion dur="2.9s" repeatCount="indefinite"
          path="M 180,0 L 0,0"/>
      </circle>
      <circle r="3">
        <animateMotion dur="3.0s" repeatCount="indefinite"
          path="M -150,90 L 0,0"/>
      </circle>
      <circle r="3">
        <animateMotion dur="2.4s" repeatCount="indefinite"
          path="M 150,90 L 0,0"/>
      </circle>
    </g>

    <!-- Zone hexes -->
    <use href="#zone" x="-150" y="-90"/>
    <use href="#zone" x=" 150" y="-90"/>
    <use href="#zone" x="-180" y="  0"/>
    <use href="#zone" x=" 180" y="  0"/>
    <use href="#zone" x="-150" y=" 90"/>
    <use href="#zone" x=" 150" y=" 90"/>

    <!-- Zone labels -->
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#cfeefb" text-anchor="middle">
      <text x="-150" y="-128">us-east</text>
      <text x=" 150" y="-128">eu-north</text>
      <text x="-180" y=" -38">eu-west</text>
      <text x=" 180" y=" -38">kr</text>
      <text x="-150" y=" 130">jp-edge</text>
      <text x=" 150" y=" 130">smart-city</text>
    </g>

    <!-- Central decision node -->
    <g>
      <circle r="42" fill="#0b1020" stroke="url(#brand)" stroke-width="2.5"/>
      <circle r="34" fill="none" stroke="#34e0a1" stroke-width="0.8" stroke-dasharray="2 4">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-2" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
            font-weight="700" fill="#7df9ff" text-anchor="middle">DECIDE</text>
      <text x="0" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
            font-weight="500" fill="#ffd166" text-anchor="middle">4-axis score</text>
    </g>
  </g>
</svg>
