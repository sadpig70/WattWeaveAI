[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattweave"
version = "0.1.0"
description = "AI-native compute–energy orchestration control plane (EnerGrid AI Fabric MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sadpig70" }]
keywords = ["ai", "energy", "orchestration", "control-plane", "carbon-aware", "sovereign-cloud", "pg", "pgf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
serve = ["uvicorn[standard]>=0.27"]

[project.scripts]
wattweave = "wattweave.control.cli:main"

[project.urls]
Homepage = "https://github.com/sadpig70/WattWeaveAI"
Issues = "https://github.com/sadpig70/WattWeaveAI/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wattweave" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
